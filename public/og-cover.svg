<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Velvet Pearl Travel Enquiries</title>
  <desc id="desc">Branded social sharing image for Velvet Pearl travel enquiries.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060912" />
      <stop offset="55%" stop-color="#0b1020" />
      <stop offset="100%" stop-color="#101710" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#22b7ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22b7ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGold" cx="82%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#b7e22a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#b7e22a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowBlue)" />
  <rect width="1200" height="630" fill="url(#glowGold)" />

  <g filter="url(#shadow)">
    <rect x="64" y="64" width="1072" height="502" rx="34" fill="#0b0f18" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.12" />
    <image href="/branding/velvet-pearl-banner-dark.png" x="96" y="112" width="1008" height="404" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
